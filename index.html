<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видеозвонок 1 на 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Видеозвонок 1 на 1</h1>
    <div id="status" class="status">Загрузка…</div>
  </header>

  <main>
    <div class="videos">
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="label">Собеседник</span>
      </div>
      <div class="video-box local">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="label">Вы</span>
      </div>
    </div>

    <div class="controls">
      <button id="callBtn" disabled>📞 Позвонить</button>
      <button id="hangupBtn" class="danger" disabled>❌ Завершить</button>
      <button id="micBtn" disabled>🎤 Микрофон: вкл</button>
      <button id="camBtn" disabled>📷 Камера: вкл</button>
      <button id="reconnectBtn" hidden>🔄 Переподключиться</button>
    </div>

    <p class="hint">
      Откройте эту страницу в двух окнах (или на двух устройствах), затем в одном из них нажмите «Позвонить».
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
